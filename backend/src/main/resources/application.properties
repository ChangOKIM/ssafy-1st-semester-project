spring.application.name=dart-service
server.port=8080
spring.config.import=optional:file:.env[.properties]


spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/dart_service?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:ssafy}
spring.datasource.password=${DB_PASSWORD:ssafy}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.ssafy.dartservice

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=60000

jwt.secret=${JWT_SECRET:ssafy-dart-service-development-secret-key-change-before-production}
jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:3600000}

krx.api-key=${KRX_API_KEY:}
krx.base-url=https://openapi.krx.co.kr

kis.app-key=${KIS_APP_KEY:}
kis.app-secret=${KIS_APP_SECRET:}
kis.base-url=https://openapi.koreainvestment.com:9443

dart.api-key=${DART_API_KEY:}
dart.base-url=https://opendart.fss.or.kr

spring.ai.openai.api-key=${GMS_API_KEY}
spring.ai.openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3

# Langfuse (Spring Boot native OTLP)
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=https://jp.cloud.langfuse.com/api/public/otel/v1/traces
management.otlp.tracing.headers.Authorization=Basic cGstbGYtOGZkNDQ4YTUtY2M2MC00NjllLThjOGUtNTA5Nzg3MWUzYmQ4OnNrLWxmLTJlZjMzNzM2LTMzNDMtNDRiMS05YzZkLWUzZjE0MmYzZWE1Zg==
management.otlp.tracing.headers.x-langfuse-ingestion-version=4

# Spring AI 프롬프트/응답 기록
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true

# HTTP span 중복 방지
management.observations.enable.http.server.requests=false
management.observations.enable.http.client.requests=false
management.observations.enable.spring.security=false